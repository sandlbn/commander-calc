# x16sheet linker config — Commander X16, resident core + disk overlays.
#
# Derived from cc65's stock cx16.cfg. Two differences:
#
#   1. The resident image (code + rodata + data + bss + C stack) is capped at
#      __OVLSTART__ instead of __HIMEM__, leaving the top of low RAM free.
#   2. Three overlay areas share that freed region. Only one is resident at a
#      time; each links to its own file and is loaded on demand from disk.
#
#   $0801 .. $7FFF   MAIN   resident: ui + workbook + numbers + platform
#   $8000 .. $9EFF   OVLn   one of: filedlg | fileio | fcompile | feval |
#                                    csv | zip | xlsx
#   $9F00 ..         I/O
#
# The .1/.2/.3 files ld65 emits are raw (no load address). The Makefile
# prepends the 2-byte little-endian header that KERNAL LOAD / cbm_load expect.

FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0200;   # 512-byte C stack.
                                             #
                                             # MEASURED, and there is less
                                             # room here than there looks.
                                             # 385 of the 512 are used by the
                                             # deepest chain -- an .xlsx
                                             # import, driver into step into
                                             # parser into tokenizer into
                                             # blob -- leaving about 127, and
                                             # the application adds a grid
                                             # frame the harness has not got.
                                             # DO NOT SHRINK THIS to reclaim
                                             # resident memory; that was
                                             # tried, on the theory below,
                                             # and the numbers said no.
                                             #
                                             # The theory was that cc65 gives
                                             # locals static storage so this
                                             # would hold only arguments and
                                             # spills. That is true only with
                                             # -Cl, which is not in X16FLAGS,
                                             # so every local really is here
                                             # -- main() alone has a char[64].
                                             #
                                             # src/tools/xlsxtest.c paints the
                                             # region and reports the high
                                             # water mark on every `make
                                             # xlsx`; the canary in main.c
                                             # catches a breach at run time.
    __HIMEM__:     type = weak, value = $9F00;
    # The overlay area is sized by its largest tenant, and every byte of it
    # is a byte resident code cannot have.
    #
    # THE TENANT IS NOT THE LARGEST .BIN. An overlay's image holds its code
    # and rodata; its BSS is placed after them and counts toward the area
    # without appearing in the file. OVL_FILEIO had the largest image at
    # 7853 and splitting its writer out dropped that to 5027 — and bought
    # nothing here, because OVL_XLSX and OVL_INFLATE need ~7915 apiece once
    # their BSS is counted, and they are what 7936 is actually sized for.
    # Read the ld65 overflow messages, not `ls`.
    #
    # So the way to move this boundary is to shrink OVL7BSS and OVL8BSS --
    # the tokenizer's buffers and the inflate window's tables -- into banked
    # RAM, and only then by however much the smaller of the two gives up.
    #
    # THE MAKEFILE PREPENDS THIS ADDRESS to each overlay image by hand, in
    # both the x16 and xlsx targets. Changing it here and not there produces
    # overlays that load at the wrong address and a machine that hangs on
    # the first file command.
    __OVLSTART__:  type = weak, value = $8000;   # overlay load address
    __OVLSIZE__:   type = weak, value = $1F00;   # $9F00 - $8000 = 7936
}

# Golden RAM: $0400-$07FF, the kilobyte below the load address.
#
# The memory map calls it "available for machine code programs or custom data
# storage" -- the X16's equivalent of the C64's $C000 block. KERNAL and DOS
# keep their variables in $0200-$03FF and in zero page, not here, so nothing
# reclaims it behind our back the way the tape and screen buffers would on a
# C64. It is the one piece of low RAM this program was not already using.
#
# It holds bss, not code, and that is the point. The resident image is capped
# not by where CODE ends but by where BSS ends: bss is placed after the code
# and has to stop short of the C stack at $7E00, so a byte of resident bss
# costs exactly as much as a byte of resident code. Moving a buffer here
# therefore buys the same space a deleted function would, without deleting
# anything -- and at 1024 bytes it is worth more than any single reclaim so
# far.
#
# Two things to know before putting something here:
#
#   1. IT IS NOT CLEARED FOR YOU. cc65's crt0 zeroes the BSS segment and
#      nothing else, so golden_init() in main.c does it for this one. A
#      static here is garbage until that runs.
#   2. It is not banked and not saved, so it survives an overlay swap -- but
#      so does resident bss, and this is not the place for anything an
#      overlay needs to hand to another overlay. That is what banked RAM is
#      for.

MEMORY {
    ZP:       file = "", define = yes, start = $0022,           size = $0080 - $0022;
    GOLDEN:   file = "", define = yes, start = $0400,           size = $0400;

    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __OVLSTART__ - __HEADER_LAST__;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __OVLSTART__ - __ONCE_RUN__ - __STACKSIZE__;

    OVL1:     file = "%O.1", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL2:     file = "%O.2", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL3:     file = "%O.3", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL4:     file = "%O.4", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL5:     file = "%O.5", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL6:     file = "%O.6", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL7:     file = "%O.7", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL8:     file = "%O.8", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL9:     file = "%O.9", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL10:    file = "%O.10", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL11:    file = "%O.11", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL12:    file = "%O.12", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL13:    file = "%O.13", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL14:    file = "%O.14", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL15:    file = "%O.15", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL16:    file = "%O.16", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
    OVL17:    file = "%O.17", define = yes, start = __OVLSTART__, size = __OVLSIZE__;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp;
    EXTZP:     load = ZP,       type = zp, optional = yes;
    LOADADDR:  load = LOADADDR, type = ro;
    EXEHDR:    load = HEADER,   type = ro;
    STARTUP:   load = MAIN,     type = ro, optional = yes;
    LOWCODE:   load = MAIN,     type = ro, optional = yes;
    CODE:      load = MAIN,     type = ro;
    RODATA:    load = MAIN,     type = ro;
    DATA:      load = MAIN,     type = rw;
    INIT:      load = MAIN,     type = rw, optional = yes;
    ONCE:      load = MAIN,     type = ro, define = yes;
    BSS:       load = BSS,      type = bss, define = yes;

    # See the note above. Reached with X16S_GOLDEN_BEGIN/END, cleared by
    # golden_init(). Optional so the host build, which has no such area,
    # links the same sources.
    GOLDENBSS: load = GOLDEN,   type = bss, define = yes, optional = yes;

    # Variables in the ZERO PAGE. Reached with X16S_ZP_BEGIN/END, cleared
    # by golden_init() along with golden RAM.
    #
    # Not for space -- there are only 64 bytes of it -- but for CODE SIZE.
    # A 6502 absolute access is three bytes and a zero-page access is two,
    # so a global that lives here makes every reference to it a byte
    # shorter, and a 16-bit one two bytes shorter. The resident image is
    # 29 KB of code and 12 bytes of bss, so code size is the only thing
    # worth attacking, and this attacks all of it at once.
    #
    # `type = zp` is what lets ca65 emit the short form; the matching hint
    # is in the pragma, and both are needed.
    ZPBSS:     load = ZP,       type = zp,  define = yes, optional = yes;

    # Overlay code, its read-only data, and its working memory.
    #
    # OVLnBSS is the important one: an overlay's scratch buffers live in the
    # tail of its own area, past its code. That costs nothing resident, which
    # matters because the decompressor's Huffman tables alone are larger than
    # all the resident memory left. Being bss it is not written to the .BIN,
    # so the file stays the size of the code.
    #
    # It is uninitialised on every load, exactly like any other bss. An
    # overlay must not expect its scratch to survive being swapped out.
    OVERLAY1:  load = OVL1,     type = ro, define = yes, optional = yes;
    OVL1RO:    load = OVL1,     type = ro, define = yes, optional = yes;
    OVL1BSS:   load = OVL1,     type = bss, define = yes, optional = yes;
    OVERLAY2:  load = OVL2,     type = ro, define = yes, optional = yes;
    OVL2RO:    load = OVL2,     type = ro, define = yes, optional = yes;
    OVL2BSS:   load = OVL2,     type = bss, define = yes, optional = yes;
    OVERLAY3:  load = OVL3,     type = ro, define = yes, optional = yes;
    OVL3RO:    load = OVL3,     type = ro, define = yes, optional = yes;
    OVL3BSS:   load = OVL3,     type = bss, define = yes, optional = yes;
    OVERLAY4:  load = OVL4,     type = ro, define = yes, optional = yes;
    OVL4RO:    load = OVL4,     type = ro, define = yes, optional = yes;
    OVL4BSS:   load = OVL4,     type = bss, define = yes, optional = yes;
    OVERLAY5:  load = OVL5,     type = ro, define = yes, optional = yes;
    OVL5RO:    load = OVL5,     type = ro, define = yes, optional = yes;
    OVL5BSS:   load = OVL5,     type = bss, define = yes, optional = yes;
    OVERLAY6:  load = OVL6,     type = ro, define = yes, optional = yes;
    OVL6RO:    load = OVL6,     type = ro, define = yes, optional = yes;
    OVL6BSS:   load = OVL6,     type = bss, define = yes, optional = yes;
    OVERLAY7:  load = OVL7,     type = ro, define = yes, optional = yes;
    OVL7RO:    load = OVL7,     type = ro, define = yes, optional = yes;
    OVL7BSS:   load = OVL7,     type = bss, define = yes, optional = yes;
    OVERLAY8:  load = OVL8,     type = ro, define = yes, optional = yes;
    OVL8RO:    load = OVL8,     type = ro, define = yes, optional = yes;
    OVL8BSS:   load = OVL8,     type = bss, define = yes, optional = yes;
    OVERLAY9:  load = OVL9,     type = ro, define = yes, optional = yes;
    OVL9RO:    load = OVL9,     type = ro, define = yes, optional = yes;
    OVL9BSS:   load = OVL9,     type = bss, define = yes, optional = yes;
    OVERLAY10: load = OVL10,    type = ro, define = yes, optional = yes;
    OVL10RO:   load = OVL10,    type = ro, define = yes, optional = yes;
    OVL10BSS:  load = OVL10,    type = bss, define = yes, optional = yes;
    OVERLAY11: load = OVL11,    type = ro, define = yes, optional = yes;
    OVL11RO:   load = OVL11,    type = ro, define = yes, optional = yes;
    OVL11BSS:  load = OVL11,    type = bss, define = yes, optional = yes;
    OVERLAY12: load = OVL12,    type = ro, define = yes, optional = yes;
    OVL12RO:   load = OVL12,    type = ro, define = yes, optional = yes;
    OVL12BSS:  load = OVL12,    type = bss, define = yes, optional = yes;
    OVERLAY13: load = OVL13,    type = ro, define = yes, optional = yes;
    OVL13RO:   load = OVL13,    type = ro, define = yes, optional = yes;
    OVL13BSS:  load = OVL13,    type = bss, define = yes, optional = yes;
    OVERLAY14: load = OVL14,    type = ro, define = yes, optional = yes;
    OVL14RO:   load = OVL14,    type = ro, define = yes, optional = yes;
    OVL14BSS:  load = OVL14,    type = bss, define = yes, optional = yes;
    OVERLAY15: load = OVL15,    type = ro, define = yes, optional = yes;
    OVL15RO:   load = OVL15,    type = ro, define = yes, optional = yes;
    OVL15BSS:  load = OVL15,    type = bss, define = yes, optional = yes;
    OVERLAY16: load = OVL16,    type = ro, define = yes, optional = yes;
    OVL16RO:   load = OVL16,    type = ro, define = yes, optional = yes;
    OVL16BSS:  load = OVL16,    type = bss, define = yes, optional = yes;
    OVERLAY17: load = OVL17,    type = ro, define = yes, optional = yes;
    OVL17RO:   load = OVL17,    type = ro, define = yes, optional = yes;
    OVL17BSS:  load = OVL17,    type = bss, define = yes, optional = yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
